<!doctype html>
<html lang="ko">
<!-- THESIS: Keep concurrent Codex work and its need for human attention visible together.
OWN-WORLD: Slate work surface, restrained blue selection, amber requests, green running states; native desktop density.
STORY: Import accounts, choose a folder, arrange live sessions, return to work needing attention.
FIRST VIEWPORT: Session rail left, work tabs above actual terminals, account monitor in a side drawer.
FORM: User-directed terminal workbench with independent saved layouts; interview decisions govern composition. -->
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'"><title>Codex Workspace</title><link rel="stylesheet" href="./app.css"></head>
<body>
<header class="appbar"><div class="brand"><span class="brand-symbol" aria-hidden="true">▦</span> Codex Workspace <span class="version">개인 작업실</span></div><div class="app-actions"><span id="connection" role="status">연결 중</span><button id="accounts-button">계정 · 사용량</button><button id="create-button" class="primary">＋ 새 세션</button></div></header>
<div id="error" role="alert" hidden><span></span><button aria-label="알림 닫기">×</button></div>
<main class="shell"><aside class="sidebar"><div class="rail-heading"><h1>세션</h1><span id="session-count">0</span></div><label class="search"><span class="sr-only">세션 검색</span><input id="search" placeholder="이름 · 폴더 검색" autocomplete="off"></label><button id="attention-filter" class="attention-filter">주의가 필요한 세션 <span>0</span></button><div id="session-list" class="session-list"></div><footer class="rail-footer">패널을 닫아도 세션은 유지됩니다.</footer></aside><section class="workarea" aria-label="터미널 작업 공간"><nav class="tabs-bar" aria-label="작업 탭"><div id="tabs" role="tablist"></div><button id="new-tab" title="새 작업 탭" aria-label="새 작업 탭">＋</button></nav><div class="layout-bar"><span id="layout-title">작업 공간</span><div><button id="add-session">기존 세션 배치</button><label>열 <select id="columns" aria-label="터미널 열 수"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><button id="rename-tab" title="작업 탭 이름 변경">이름 변경</button></div></div><div id="workspaces"></div></section><aside id="accounts-drawer" class="drawer" hidden aria-label="계정 및 사용량"><div class="drawer-heading"><h2>계정 · 사용량</h2><button id="close-accounts" aria-label="계정 창 닫기">×</button></div><p class="muted">Orca 계정을 자동으로 인식해 독립 이전합니다. 이전 뒤에는 Orca에서 같은 계정을 사용하지 마세요.</p><div class="drawer-actions"><button id="import-accounts" class="primary">Orca 다시 검색</button><button id="repair-account">재인증 파일 선택</button><button id="refresh-accounts">지금 갱신</button></div><div id="accounts-summary"></div><div id="accounts-list"></div></aside></main>
<footer class="statusbar"><span id="global-status">런타임 연결 중…</span><span>창을 닫아도 작업 유지 · Codex CLI</span></footer>
<dialog id="form-dialog"><form method="dialog" id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button value="cancel" aria-label="닫기" formnovalidate>×</button></div><div id="dialog-fields"></div><div class="dialog-actions"><button value="cancel" formnovalidate>취소</button><button id="dialog-submit" value="ok" class="primary">확인</button></div></form></dialog>
<script type="module" src="./app.js"></script></body></html>
